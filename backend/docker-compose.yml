x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://summarist:summarist@postgres:5432/thesummarist
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-to-a-long-random-string}
  LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
  STORAGE_BACKEND: local
  STORAGE_LOCAL_DIR: /data/storage
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: summarist
      POSTGRES_PASSWORD: summarist
      POSTGRES_DB: thesummarist
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U summarist -d thesummarist"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    command: alembic upgrade head
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment: *backend-env
    ports:
      - "8000:8000"
    volumes:
      - storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    command: arq app.workers.worker.WorkerSettings
    environment: *backend-env
    volumes:
      - storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  redisdata:
  storage:
