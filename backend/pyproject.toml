[project]
name = "thesummarist-backend"
version = "0.1.0"
description = "FastAPI backend for TheSummarist document summarization product"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "PyJWT>=2.8",
    "pwdlib[argon2]>=0.2.0",
    "httpx>=0.27",
    "arq>=0.26",
    "redis>=5.0",
    "pypdf>=4.3",
    "python-docx>=1.1",
    "python-pptx>=0.6.23",
    "pillow>=10.3",
    "pytesseract>=0.3.13",
    "trafilatura>=1.8",
    "boto3>=1.34",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "aiosqlite>=0.20",
    "ruff>=0.16.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = [
    "B008", # function-call-in-default-argument — FastAPI Depends/Query/File idiom
]

[tool.ruff.lint.per-file-ignores]
"app/services/pipeline.py" = ["BLE001", "S110"]
"app/api/documents.py" = ["BLE001", "S110"]
"app/api/summaries.py" = ["BLE001", "S110"]
"tests/*" = ["BLE001"]
